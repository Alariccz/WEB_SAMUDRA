# ========================================================
# 1. ADMIN DASHBOARD SUBDOMAIN (admin.samudra.buzz)
# ========================================================
server {
    listen 80;
    server_name admin.samudra.buzz;
    root /usr/share/nginx/html;
    index admin.html;

    include /etc/nginx/mime.types;

    # SPA routing untuk Admin Dashboard
    location / {
        try_files $uri $uri/ /admin.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|wasm|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
    gzip_min_length 1000;
}

# ========================================================
# 2. WEBSITE PUBLIK UTAMA (samudra.buzz) & DEFAULT
# ========================================================
server {
    listen 80 default_server;
    server_name samudra.buzz www.samudra.buzz _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # SPA routing untuk Website Publik
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|wasm|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
    gzip_min_length 1000;
}
