name: CI/CD Pipeline - Web Samudra

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Memulai otomatisasi deployment pada server..."
            cd ${{ secrets.SERVER_PATH }}
            
            echo "📥 Mengambil perubahan terbaru dari branch main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "⚙️ Menjalankan script deployment..."
            chmod +x deploy.sh
            ./deploy.sh
            
            echo "🎉 Deployment selesai dengan sukses!"
